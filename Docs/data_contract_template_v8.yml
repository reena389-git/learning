# END OF CONTRACT
# =============================================================================
# Migration note:
#   This v8 contract is a working subset of the v7 shape. Anything in v7 that
#   doesn't appear here either (a) lives in Git or another upstream artefact
#   now, (b) is deferred (see Section 10 stubs), or (c) was removed because
#   no peer or industry standard carried it.
#
#   v8 is the MVP we ship today. v7 is the maturity target.
# =============================================================================
