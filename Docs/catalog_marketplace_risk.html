<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Data Marketplace — Prototype v2</title>
<style>
:root{--ink:#0f1b2d;--slate:#55636d;--line:#e2e7eb;--bg:#f4f6f8;--surface:#fff;--green:#0a7a3b;--green-d:#0d5a2b;--green-t:#eaf5ee;--greenln:#bfe0c8;--blue:#1b64b0;--blue-t:#e9f1fb;--amber:#8a6410;--amber-t:#fff7e6;--violet:#6a4fb0;--violet-t:#efeaf9;--red:#c0392b;--red-t:#fdecea;--redln:#f2c4bd;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
a{color:inherit;text-decoration:none;cursor:pointer;}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
.hbar{display:flex;align-items:center;justify-content:space-between;height:54px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;}
.logo{width:30px;height:30px;border-radius:7px;background:var(--green-d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.pill{font-size:10px;font-weight:700;color:var(--slate);background:#eef1f3;border:1px solid var(--line);border-radius:10px;padding:1px 7px;}
nav{display:flex;gap:2px;font-size:12.5px;flex-wrap:wrap;}
nav a{padding:6px 9px;border-radius:7px;color:var(--slate);font-weight:600;}
nav a.on{background:#eef1f3;color:var(--ink);}
.banner{background:#fdecea;border-bottom:1px solid #f2c4bd;color:var(--red);font-size:11.5px;font-weight:800;letter-spacing:.4px;text-align:center;padding:4px;position:sticky;top:54px;z-index:19;}
.crumb{font-size:12.5px;color:var(--slate);padding:14px 0 2px;}
.crumb a:hover{color:var(--blue);text-decoration:underline;}.crumb span{color:#9aa7b0;margin:0 6px;}
.hero{padding:20px 0 4px;}.hero h1{font-size:25px;font-weight:800;letter-spacing:-.2px;}
.hero p{color:var(--slate);font-size:15px;margin-top:5px;max-width:800px;}
.search{margin:16px 0 6px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid #cfd6da;border-radius:11px;padding:11px 14px;}
.search:focus-within{border-color:var(--green);}.search input{border:none;outline:none;font-size:15px;width:100%;background:transparent;}.search .ic{color:#9aa7b0;}
h2.sec{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--slate);margin:30px 0 13px;}
.grid{display:grid;gap:13px;}.g4{grid-template-columns:repeat(4,1fr);}.g3{grid-template-columns:repeat(3,1fr);}.g2{grid-template-columns:repeat(2,1fr);}.g1{grid-template-columns:1fr;}
@media(max-width:880px){.g4,.g3,.g2{grid-template-columns:1fr 1fr !important;}.trust{grid-template-columns:1fr 1fr !important;}}
@media(max-width:560px){.g4,.g3,.g2{grid-template-columns:1fr !important;}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;transition:border-color .15s,box-shadow .15s;}
.tile.click{cursor:pointer;}.tile.click:hover{border-color:var(--green);box-shadow:0 2px 10px rgba(13,90,43,.06);}
.tile h3{font-size:15px;font-weight:700;}.tile .meta{font-size:12px;color:var(--slate);margin-top:4px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;border:1px solid var(--line);border-radius:9px;padding:1px 7px;background:#f7f9fa;color:var(--slate);gap:4px;}
.chip.dom{background:var(--blue-t);border-color:#cfe0f3;color:var(--blue);}
.chip.prod{background:var(--green-t);border-color:var(--greenln);color:var(--green-d);}
.chip.v{background:#f3eefc;border-color:#d9ccf0;color:var(--violet);}
/* ===== Risk question cards ===== */
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}@media(max-width:880px){.qgrid{grid-template-columns:1fr;}}
.qcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:11px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.qcard:hover{box-shadow:0 3px 14px rgba(0,0,0,.06);border-left-color:var(--green-d);}
.qcard .q{font-size:15px;font-weight:700;}.qcard .a{font-size:12.5px;color:var(--slate);margin-top:4px;}
.qcard .go{font-size:11.5px;font-weight:700;color:var(--green-d);margin-top:9px;}
/* ===== Trust header (consistent object header) ===== */
.obj-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:6px 0 2px;flex-wrap:wrap;}
.obj-head h1{font-size:24px;font-weight:800;}
.obj-type{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--green-d);background:var(--green-t);border:1px solid var(--greenln);border-radius:8px;padding:2px 9px;display:inline-block;margin-bottom:7px;}
.obj-sub{color:var(--slate);font-size:14px;margin-top:5px;max-width:800px;}
.trust{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:15px 0 4px;}
.trust .cell{background:var(--surface);padding:10px 13px;}
.trust .k{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#9aa7b0;}
.trust .val{font-size:13px;font-weight:700;color:var(--ink);margin-top:3px;display:flex;align-items:center;gap:6px;}
.trust .val.link{color:var(--green-d);cursor:pointer;}.trust .val.link:hover{text-decoration:underline;}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}.dot.g{background:var(--green);}.dot.a{background:#e0a500;}.dot.r{background:var(--red);}
/* ===== badges ===== */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 8px;}
.b-cert{background:var(--green-t);color:var(--green-d);border:1px solid var(--greenln);}
.b-draft{background:var(--amber-t);color:var(--amber);border:1px solid #e8cf94;}
.b-dash{background:var(--violet-t);color:var(--violet);border:1px solid #d6cbee;}
.demo{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;border-radius:9px;padding:1px 8px;background:#fff4e0;color:#9a6a00;border:1px solid #f0cf94;}
.dqpill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:10px;padding:2px 9px;}
.dq-g{background:var(--green-t);color:var(--green-d);border:1px solid var(--greenln);}
.dq-a{background:var(--amber-t);color:var(--amber);border:1px solid #e8cf94;}
.dq-r{background:var(--red-t);color:var(--red);border:1px solid var(--redln);}
/* ===== tabs ===== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:18px;flex-wrap:wrap;}
.tabs a{padding:9px 13px;font-size:13px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;}
.tabs a.on{color:var(--ink);border-bottom-color:var(--green);}
.panel{padding:18px 0;}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);margin:16px 0 9px;}
.lbl:first-child{margin-top:2px;}
.note{font-size:12.5px;color:var(--slate);margin-top:8px;}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.btn{border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);}
.btn.primary{background:var(--green-d);color:#fff;border-color:var(--green-d);}
.btn.ok{background:var(--green-t);color:var(--green-d);border-color:var(--greenln);}
.btn:disabled{opacity:.5;cursor:default;}
/* ===== tables ===== */
table.tb{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
table.tb th{background:#eef1f4;color:var(--ink);text-align:left;padding:8px 10px;font-weight:700;font-size:12px;border-bottom:2px solid #c7d0d6;}
table.tb td{padding:7px 10px;border-bottom:1px solid #eef1f2;vertical-align:top;}
table.tb tr:last-child td{border-bottom:none;}
.mono{font-family:"Consolas","SF Mono",monospace;}
.pkt{color:var(--green-d);font-weight:700;font-size:10px;}.fkt{color:var(--blue);font-weight:700;font-size:10px;}
.cdeflag{font-size:9px;font-weight:800;border-radius:6px;padding:0 5px;background:#fdecea;color:var(--red);border:1px solid var(--redln);margin-left:4px;vertical-align:middle;}
.cdeok{font-size:9px;font-weight:800;border-radius:6px;padding:0 5px;background:var(--green-t);color:var(--green-d);border:1px solid var(--greenln);margin-left:4px;vertical-align:middle;}
/* ===== DQ scorecard ===== */
.score{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;flex-wrap:wrap;}
.score .big{font-size:38px;font-weight:800;line-height:1;}
.score .ring{width:74px;height:74px;flex:none;}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 20px;flex:1;min-width:280px;}@media(max-width:560px){.dims{grid-template-columns:1fr 1fr;}}
.dim .dn{font-size:11.5px;font-weight:700;color:var(--slate);display:flex;justify-content:space-between;}
.bar{height:6px;border-radius:4px;background:#eef1f3;margin-top:4px;overflow:hidden;}
.bar>span{display:block;height:100%;border-radius:4px;}
/* ===== workflow ===== */
.wf{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:6px 0 10px;}
.wf .st{font-size:11px;font-weight:700;padding:5px 11px;border:1px solid var(--line);background:#f7f9fa;color:#9aa7b0;border-radius:20px;}
.wf .st.done{background:var(--green-t);color:var(--green-d);border-color:var(--greenln);}
.wf .st.cur{background:var(--green-d);color:#fff;border-color:var(--green-d);}
.wf .arw{color:#c3ccd3;margin:0 6px;font-weight:700;}
.status{font-size:10.5px;font-weight:800;border-radius:9px;padding:1px 8px;text-transform:uppercase;letter-spacing:.3px;}
.s-open{background:var(--red-t);color:var(--red);border:1px solid var(--redln);}
.s-assigned{background:var(--amber-t);color:var(--amber);border:1px solid #e8cf94;}
.s-prog{background:var(--blue-t);color:var(--blue);border:1px solid #cfe0f3;}
.s-resolved{background:var(--green-t);color:var(--green-d);border:1px solid var(--greenln);}
.sev{font-size:9.5px;font-weight:800;border-radius:6px;padding:0 6px;text-transform:uppercase;}
.sev-high{background:#fdecea;color:var(--red);}.sev-med{background:#fff7e6;color:var(--amber);}.sev-low{background:#eef1f3;color:var(--slate);}
/* ===== lineage ===== */
.lin{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;overflow-x:auto;padding:4px 0 8px;}
.lin .col{flex:1;min-width:150px;padding:0 10px;}
.lin .col:first-child{padding-left:0;}
.lin .ch{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#9aa7b0;margin-bottom:7px;text-align:center;}
.lin .nd{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600;margin-bottom:7px;text-align:center;}
.lin .nd.src{border-color:#cfd6da;}
.lin .nd.prd{border:1.6px solid var(--green);background:var(--green-t);color:var(--green-d);font-weight:700;}
.lin .nd.con{border-color:#d6cbee;background:var(--violet-t);color:var(--violet);}
.lin .arrow{display:flex;align-items:center;justify-content:center;color:#c3ccd3;font-size:20px;flex:0 0 22px;}
/* ===== semantic / ontology ===== */
.svgbox{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;overflow:auto;margin-bottom:10px;}
.ent{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;background:var(--surface);}
.ent .en{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;}
.ent .ed{font-size:12.5px;color:#42525c;margin-top:2px;}
.loc{background:var(--ink);color:#e7eef5;border-radius:9px;padding:11px 13px;font-size:12.5px;}.loc .p{color:#7fd6a0;font-family:"Consolas",monospace;}
.box2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:13px;}
.kv .k{color:var(--slate);font-weight:600;}
.ph{border:1.5px dashed #c3ccd3;border-radius:12px;padding:22px;text-align:center;color:#8a97a0;font-size:13.5px;background:#fafbfc;}

.portal{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:8px;}
@media(max-width:880px){.portal{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.portal{grid-template-columns:1fr;}}
.pbox{border-radius:13px;padding:15px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);transition:box-shadow .15s,border-color .15s;border-top:4px solid #c9d2d8;}
.pbox:hover{box-shadow:0 3px 14px rgba(0,0,0,.07);border-color:#cfd6da;}
.pbox .pt{font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pbox .pd{font-size:12px;color:var(--slate);margin-top:5px;line-height:1.45;}
.pbox .pprev{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.pbox.prod{border-top-color:var(--green);}.pbox.biz{border-top-color:var(--green-d);}.pbox.data{border-top-color:var(--blue);}.pbox.dq{border-top-color:var(--red);}.pbox.sem{border-top-color:var(--violet);}.pbox.glos{border-top-color:#9a6a00;}
.mini{font-size:10px;font-weight:700;color:var(--slate);background:#f2f5f6;border:1px solid var(--line);border-radius:8px;padding:1px 7px;}


.backbar{padding:12px 0 0;}.backbar a{font-size:12.5px;color:var(--slate);font-weight:700;cursor:pointer;}.backbar a:hover{color:var(--blue);}
.capsec{margin-bottom:22px;}
.caphd{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);border-bottom:2px solid var(--line);padding-bottom:7px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.caphd .capapps{font-weight:400;text-transform:none;letter-spacing:0;color:#9aa7b0;font-size:11.5px;}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:22px;}@media(max-width:700px){.twocol{grid-template-columns:1fr;}}
.collbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#9aa7b0;margin-bottom:8px;}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;cursor:pointer;}
.rowlink:hover{border-color:var(--green);}
.rowlink .rl-name{font-weight:600;font-size:13.5px;}
.rowlink .rl-sub{font-size:11px;color:#9aa7b0;font-weight:600;}
.emptyrow{font-size:12.5px;color:#9aa7b0;padding:8px 2px;}
.dqsum{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:11px 14px;font-size:13px;margin:2px 0 18px;cursor:pointer;}
.dqsum:hover{box-shadow:0 2px 10px rgba(0,0,0,.05);}


.treehdr{display:grid;grid-template-columns:190px 1fr 1fr 1fr;gap:14px;padding:0 0 8px;border-bottom:2px solid #c7d0d6;}
.treehdr .th{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#2b3947;}
.capnode{border-bottom:1px solid var(--line);}
.caprow{display:grid;grid-template-columns:190px 1fr 1fr 1fr;gap:14px;align-items:start;padding:11px 0;cursor:pointer;}
.capname{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;}
.capname .chev{font-size:10px;color:#9aa7b0;width:12px;}
.capname .apps{display:block;font-weight:400;color:#9aa7b0;font-size:10.5px;margin-top:2px;margin-left:20px;}
.tcol{display:flex;flex-direction:column;gap:2px;padding-top:1px;}
.titem{font-size:13.5px;color:var(--ink);cursor:pointer;padding:2px 0;}
.titem:hover{color:var(--green-d);text-decoration:underline;}
.titem .s{color:#9aa7b0;font-size:11px;font-weight:600;margin-left:6px;}
.tnone{color:#c3ccd3;font-size:12.5px;}
@media(max-width:760px){.treehdr{grid-template-columns:1fr;}.treehdr .th{display:none;}.caprow{grid-template-columns:1fr;gap:6px;}.tcol{padding-left:20px;}.tcol::before{content:attr(data-lbl);font-size:10px;font-weight:800;text-transform:uppercase;color:#9aa7b0;}}


.subbar{position:sticky;top:90px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--green-d);color:#fff;border-radius:10px;padding:9px 14px;margin:4px 0 12px;font-size:13px;}
.subbar .btn{padding:6px 12px;font-size:12px;}
.subform{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:4px 0 14px;}
.frow{display:flex;align-items:center;gap:14px;margin:10px 0;flex-wrap:wrap;}
.frow>label{font-size:12px;font-weight:700;color:var(--slate);width:120px;}
.finput{border:1px solid #cfd6da;border-radius:8px;padding:8px 11px;font-size:13px;min-width:260px;outline:none;}
.finput:focus{border-color:var(--green);}
.radios{display:flex;gap:16px;font-size:13px;}.radios label{display:flex;align-items:center;gap:5px;font-weight:500;color:var(--ink);width:auto;}


.filterbar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px;}
.fchip{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;cursor:pointer;color:var(--slate);}
.fchip.on{background:var(--green-d);color:#fff;border-color:var(--green-d);}
.srcname{cursor:pointer;color:var(--ink);font-weight:700;}
.applink{cursor:pointer;}.applink:hover{color:var(--green-d);text-decoration:underline;}
.srcname:hover{color:var(--green-d);text-decoration:underline;}
.subsum{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:11px 14px;font-size:13px;margin:0 0 18px;cursor:pointer;}
.subsum:hover{box-shadow:0 2px 10px rgba(0,0,0,.05);}


.facets{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin:6px 0 16px;}
.facet{display:flex;flex-direction:column;gap:4px;}
.facet.grow{flex:1;min-width:200px;}
.facet label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#9aa7b0;}
.fsel{border:1px solid #cfd6da;border-radius:8px;padding:8px 10px;font-size:13px;background:var(--surface);outline:none;color:var(--ink);}
.fsel:focus{border-color:var(--green);}
.pbox.subs{border-top-color:#0b7285;}

footer{color:#9aa7b0;font-size:11.5px;text-align:center;padding:30px 0;}
.contract-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}@media(max-width:560px){.contract-grid{grid-template-columns:1fr 1fr;}}
.cstat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
.cstat .ck{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#9aa7b0;}
.cstat .cv{font-size:15px;font-weight:800;margin-top:3px;}
</style>
</head>
<body>
<header><div class="wrap hbar">
<div class="brand"><div class="logo">TD</div>Risk Data Marketplace <span class="pill">PROTOTYPE v2</span></div>
<nav id="nav">
<a data-nav="home" onclick="go('home')">Home</a>
<a data-nav="domains" onclick="go('domains')">Business Domains</a>
<a data-nav="sources" onclick="go('sources')">Data Sources</a>
<a data-nav="ontology" onclick="go('ontology')">Semantic Model</a>
<a data-nav="glossary" onclick="go('glossary')">Glossary</a>
<a data-nav="access" onclick="go('access')">My Access</a>
</nav>
</div></header>
<div class="banner">REPRESENTATIVE ONLY — illustrative data &amp; design prototype, not live TD data</div>
<div class="wrap" id="app"></div>
<footer class="wrap">Risk Data Marketplace — prototype v2 · representative only · for review</footer>
<script>
/* ================= DATA MODEL ================= */
const CATALOG = "d4001-centralus-tdvip-creditrisk.xvala_core";
const CATALOG_ROOT = "d4001-centralus-tdvip-creditrisk";

/* Risk questions that drive the landing page */
const QUESTIONS = [

n recovery rate."}, {"code": "SIMM_CREDIT_DELTA", "cat": "Sensitivity (ISDA SIMM)", "lvl": "Trade", "def": "Credit delta computed per ISDA SIMM conventions (prescribed tenors 1Y/2Y/3Y/5Y/10Y, 1bp shift) as input to the CRIF for initial margin."}, {"code": "SIMM_FX_DELTA", "cat": "Sensitivity (ISDA SIMM)", "lvl": "Trade", "def": "FX delta per ISDA SIMM (change for a 1% move in each currency vs the calculation currency) for initial margin."}, {"code": "SIMM_IR_DELTA", "cat": "Sensitivity (ISDA SIMM)", "lvl": "Trade", "def": "Interest rate delta per ISDA SIMM by currency, sub-curve and the 12 SIMM tenors (2W–30Y) for initial margin."}, {"code": "SIMM_IR_VEGA", "cat": "Sensitivity (ISDA SIMM)", "lvl": "Trade", "def": "Interest rate vega per ISDA SIMM (sensitivity to implied volatility by option expiry) for initial margin."}, {"code": "SIMM_XCCY_DELTA", "cat": "Sensitivity (ISDA SIMM)", "lvl": "Trade", "def": "Cross-currency basis delta per ISDA SIMM (1bp shift in the XCCY basis spread) for initial margin."}, {"code": "SPREAD_DV01", "cat": "Sensitivity (Greek)", "lvl": "Trade", "def": "Change in value for a 1bp parallel move in the credit spread — CDS equivalent of DV01 (comparable to CS01)."}, {"code": "TRANSFORMED_IR_DELTA", "cat": "Sensitivity (Risk policy)", "lvl": "Trade", "def": "IR delta re-mapped from native pricing curve instruments onto a standard set of risk factors/tenors via a transformation (Jacobian / risk-transform matrix — the 'RT-MATRIX' tags). Makes deltas comparable across systems for VaR/FRTB."}, {"code": "ZSP01", "cat": "Sensitivity (Greek)", "lvl": "Trade", "def": "Z-spread 01: change in value for a 1bp move in the Z-spread."}]}, {"fam": "Pricing & Spread", "desc": "Spreads, par rates and price/yield conversions used in pricing.", "n": 16, "members": [{"code": "BASIS_FACTOR", "cat": "Reference / Pricing", "lvl": "Trade", "def": "Adjustment factor reflecting the basis between two related instruments or curves (e.g. cash bond vs future, or index vs f /* ================= ROUTER + HELPERS ================= */
let state={view:'home',id:null,tab:null,q:'',subs:{}};
let _hist=[];
function go(v,id,tab,isBack){
  if(!isBack){_hist.push({view:state.view,id:state.id,tab:state.tab});if(_hist.length>60)_hist.shift();}
  state.view=v;state.id=(id===undefined||id===null)?null:id;state.tab=tab||null;if(v!=='glossary')state.q=state.q;
  window.scrollTo(0,0);render();
}
function back(){const p=_hist.pop();if(p)go(p.view,p.id,p.tab,true);}
function esc(s){return(s==null?'':(''+s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function dqCls(s){return s>=95?'g':s>=85?'a':'r';}
function dqBarColor(s){return s>=95?'#0a7a3b':s>=85?'#e0a500':'#c0392b';}
function dqPill(s){const c=dqCls(s);return `<span class="dqpill dq-${c}"><span class="dot ${c}"></span>DQ ${s}%</span>`;}
function certBadge(c){return c==='certified'?'<span class="badge b-cert">\u2713 Certified</span>':'<span class="badge b-draft">\u25CB Draft</span>';}
function term(id){const g=GLOSSARY[id];if(!g)return '';return `<span class="chip v" style="cursor:pointer" onclick="go('term','${id}')">${esc(g.t.split(' (')[0])}</span>`;}

/* --- the consistent object / trust header, used on EVERY object page --- */
function trustHeader(o){
  const openIss=ISSUES.filter(i=>i.prod===o.id&&i.status!=='resolved').length;
  const dqVal = o.dq ? `<span class="val link" onclick="go('product','${o.id}','dq')">${dqPill(o.dq.score)}${openIss?` <span class="status s-open" style="font-size:9px">${openIss} open</span>`:''}</span>` : '<span class="val">\u2014</span>';
  return `
  <div class="obj-head">
    <div>
      <div class="obj-type">${esc(o.type)}</div>
      <h1>${esc(o.name)}</h1>
      <div class="obj-sub">${esc(o.oneLiner)}</div>
    </div>
    <div>${certBadge(o.cert)}</div>
  </div>
  <div class="trust">
    <div class="cell"><div class="k">Owner</div><div class="val">${esc(o.owner)}</div></div>
    <div class="cell"><div class="k">Certification</div><div class="val"><span class="dot ${o.cert==='certified'?'g':'a'}"></span>${o.cert==='certified'?'Certified':'Draft'}</div></div>
    <div class="cell"><div class="k">Freshness</div><div class="val">${esc(o.fresh)}<span style="font-weight:500;color:#9aa7b0;font-size:11px">· ${esc(o.freshNote||'')}</span></div></div>
    <div class="cell"><div class="k">Data quality</div><div>${dqVal}</div></div>
    <div class="cell"><div class="k">Classification</div><div class="val" style="font-weight:600">${esc(o.cls)}</div></div>
  </div>`;
}

/* ================= PRODUCT DETAIL (consistent + progressive disclosure) ================= */
function vProduct(){
  const p=PRODUCTS[state.id];const tab=state.tab||'overview';
  const T=(id,l)=>`<a class="${tab===id?'on':''}" onclick="go('product','${p.id}','${id}')">${l}</a>`;
  let body='';
  if(tab==='overview') body=prodOverview(p);
  else if(tab==='dq') body=prodDQ(p);
  else if(tab==='schema') body=prodSchema(p);
  else if(tab==='sample') body=prodSample(p);
  else if(tab==='lineage') body=prodLineage(p);
  else if(tab==='access') body=prodAccess(p);
  return `<div class="crumb"><a onclick="go('home')">Home</a><span>\u203A</span><a onclick="go('products')">Data Products</a><span>\u203A</span>${esc(p.name)}</div>
  ${trustHeader(p)}
  <div class="tabs">${T('overview','Overview')}${T('dq','Data Quality')}${T('schema','Schema &amp; Dictionary')}${T('sample','Sample')}${T('lineage','Lineage')}${T('access','Access')}</div>
  <div class="panel">${body}</div>`;
}

/* ---- DATA QUALITY tab: scorecard + CDE breakdown + issue workflow ---- */
function ring(score){
  const c=dqBarColor(score);const r=30,circ=2*Math.PI*r,off=circ*(1-score/100);
  return `<svg class="ring" viewBox="0 0 74 74"><circle cx="37" cy="37" r="${r}" fill="none" stroke="#eef1f3" stroke-width="7"/><circle cx="37" cy="37" r="${r}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 37 37)"/><text x="37" y="42" text-anchor="middle" font-size="18" font-weight="800" fill="${c}">${score}</text></svg>`;
}
function prodDQ(p){
  const dims=Object.entries(p.dq.dims);
  const iss=ISSUES.filter(i=>i.prod===p.id);
  return `
  <div class="lbl">Quality scorecard</div>
  <div class="score">
    ${ring(p.dq.score)}
    <div style="min-width:60px"><div class="big" style="color:${dqBarColor(p.dq.score)}">${p.dq.score}<span style="font-size:16px">%</span></div><div class="note" style="margin-top:2px">overall</div></div>
    <div class="dims">
      ${dims.map(([n,v])=>`<div class="dim"><div class="dn"><span>${n}</span><span style="color:${dqBarColor(v)}">${v}%</span></div><div class="bar"><span style="width:${v}%;background:${dqBarColor(v)}"></span></div></div>`).join('')}
    </div>
  </div>
  <div class="note">The catalog <b>surfaces</b> quality results and owns the workflow around them; measurement is produced upstream, not computed here. Each CDE is owned by whoever is accountable for its correctness, which may differ from the product owner — a <b>computed value is owned by the engine that calculates it</b> (here MRI assembles the product but does not own the marks).</div>

  <div class="lbl">Critical Data Elements (CDEs)</div>
  <div class="note" style="margin-top:0;margin-bottom:9px">These are the fields whose quality materially drives the risk numbers this product feeds. ${term('cde')}</div>
  <table class="tb"><tr><th>Critical data element</th><th>Monitored dimension</th><th>Owned by</th><th>Status</th><th>Detail</th></tr>
  ${p.cdes.map(cd=>{const cl=cd.st==='ok'?'g':cd.st==='warn'?'a':'r';const lbl=cd.st==='ok'?'Pass':cd.st==='warn'?'Watch':'Breach';const own=cd.owner||p.owner;const diff=cd.owner&&cd.owner!==p.owner;return `<tr><td class="mono"><b>${esc(cd.c)}</b></td><td>${esc(cd.dim)}</td><td class="note" style="margin:0">${esc(own)}${diff?' <span class="chip" style="font-size:9px">not product owner</span>':''}</td><td><span class="dqpill dq-${cl}"><span class="dot ${cl}"></span>${lbl}</span></td><td class="note" style="margin:0">${esc(cd.note)}</td></tr>`;}).join('')}
  </table>

  <div class="lbl">Open quality issues <span class="note" style="font-weight:400;text-transform:none;letter-spacing:0">\u2014 raise \u2192 assign steward \u2192 remediate \u2192 resolve</span></div>
  ${iss.length?dqIssueTable(iss):'<div class="ph">No quality issues raised on this product.</div>'}
  <div class="btns"><button class="btn primary" onclick="openDqIssue('${p.id}')">Raise a quality issue</button></div>
  <div id="dqIssueForm"></div>`;
}
function dqIssueTable(iss){
  const st=(s)=>({open:['s-open','Open'],assigned:['s-assigned','Assigned'],prog:['s-prog','In remediation'],resolved:['s-resolved','Resolved']}[s]);
  const sv=(s)=>({high:['sev-high','High'],med:['sev-med','Med'],low:['sev-low','Low']}[s]);
  return `<table class="tb"><tr><th>ID</th><th>Issue</th><th>CDE</th><th>Sev</th><th>Status</th><th>Steward</th><th>Raised</th></tr>
  ${iss.map(i=>{const s=st(i.status),v=sv(i.sev);return `<tr><td class="mono">${i.id}</td><td>${esc(i.title)}</td><td class="mono">${esc(i.cde)}</td><td><span class="sev ${v[0]}">${v[1]}</span></td><td><span class="status ${s[0]}">${s[1]}</span></td><td>${esc(i.steward)}</td><td class="note" style="margin:0">${esc(i.raised)}</td></tr>`;}).join('')}
  </table>`;
}

const PROD_PORTS={

function portsSection(p){
  const ports=PROD_PORTS[p.id]||[{n:'Table',shape:'\u2014',fo:'\u2014',loc:(p.datasets&&p.datasets[0])?p.datasets[0].t:''}];
  const star = p.id==='val' ? `<div class="lbl">Analytical star schema <span class="note" style="font-weight:400;text-transform:none;letter-spacing:0">\u2014 the BI output port</span></div><div class="svgbox">${STAR_VAL}</div>` : '';
  return `<div class="lbl" style="margin-top:2px">Output ports <span class="note" style="font-weight:400;text-transform:none;letter-spacing:0">\u2014 one product, several representations</span></div>
  <div class="note" style="margin-top:0;margin-bottom:9px">A data product is a <b>contract</b>; it is served through one or more <b>output ports</b>. The star schema is the analytical port, <b>not a separate product</b> \u2014 and a report consumes a port.</div>
  <table class="tb"><tr><th>Port</th><th>Shape</th><th>For</th><th>Physical location</th></tr>
  ${ports.map(o=>`<tr><td><b>${esc(o.n)}</b></td><td>${esc(o.shape)}</td><td class="note" style="margin:0">${esc(o.fo)}</td><td class="mono" style="color:#1b64b0">${esc(o.loc)}</td></tr>`).join('')}
  </table>${star}`;
}
function openDsIssue(id){

  const dims=['Completeness','Validity','Accuracy','Timeliness','Uniqueness','Consistency'];
  document.getElementById('dsIssueForm').innerHTML=`<div class="subform" style="margin-top:12px">
    <div class="lbl" style="margin-top:0">Raise a quality issue \u2014 ${esc(x.name)}</div>
    <div class="note" style="margin-top:0;margin-bottom:12px">Creates a tracked issue against this dataset, routed to the dataset owner.</div>
    <div class="frow"><label>Affected column</label><select id="dsCol" class="fsel">${colOpts}</select></div>
    <div class="frow"><label>Quality dimension</label><select id="dsDim" class="fsel">${dims.map(d=>`<option>${d}</option>`).join('')}</select></div>
    <div class="frow"><label>Severity</label><span class="radios"><label><input type="radio" name="dsSev" value="High"> High</label><label><input type="radio" name="dsSev" value="Medium" checked> Medium</label><label><input type="radio" name="dsSev" value="Low"> Low</label></span></div>
    <div class="frow"><label>Description</label><input id="dsDesc" class="finput" style="min-width:340px" placeholder="What is wrong"></div>
    <div class="frow"><label>Routed to</label><span class="note" style="margin:0">${esc(x.owner)}</span></div>

function submitDsIssue(id){
  const x=DATASETS[id];
  const col=document.getElementById('dsCol').value;const dim=document.getElementById('dsDim').value;
  const sevR=document.querySelector('input[name=dsSev]:checked');const sev=sevR?sevR.value:'Medium';
  const desc=document.getElementById('dsDesc').value||'(no description)';
  const iid='DQ-'+(100+Math.floor(Math.random()*900));
  document.getElementById('dsIssueForm').innerHTML=`<div class="subform" style="margin-top:12px;border-color:var(--greenln);background:var(--green-t)"><b style="color:var(--green-d)">\u2713 Issue ${iid} raised</b> <span class="demo">representative</span><div class="note" style="margin-top:6px">${esc(x.name)} \u00b7 ${esc(col)} \u00b7 ${esc(dim)} \u00b7 <b>${esc(sev)}</b> \u2014 routed to <b>${esc(x.owner)}</b></div><div class="note">${esc(desc)}</div></div>`;
}

function prodSchema(p){
  if(p.id==='val') return valSchema(p);
  return `
  ${portsSection(p)}
  <div class="lbl">Datasets in this product</div>
  <table class="tb"><tr><th>Dataset</th><th>Grain</th><th>Description</th></tr>
  ${p.datasets.map(d=>`<tr><td class="mono"><b>${esc(d.t)}</b></td><td>${esc(d.grain)}</td><td>${esc(d.d)}</td></tr>`).join('')}
  </table>
  <div class="lbl">Column dictionary \u2014 ${esc(p.datasets[0].t)}</div>
  <div class="note" style="margin-top:0;margin-bottom:9px">CDE-flagged columns carry a quality badge. Representative sample.</div>
  <table class="tb"><tr><th>Column</th><th>Type</th><th>Definition</th></tr>
  ${schemaCols(p).map(c=>`<tr><td class="mono"><b>${esc(c.c)}</b>${cdeTag(c)}</td><td class="mono" style="color:#1b64b0">${esc(c.t)}</td><td class="note" style="margin:0">${esc(c.d)}</td></tr>`).join('')}
  </table>
  <div class="loc" style="margin-top:14px"><b style="color:#fff">Physical location</b> &nbsp; <span class="p">${CATALOG}.${esc(p.datasets[0].t)}</span></div>`;
}
function cdeTag(c){if(!c.cde)return '';return c.cdest==='bad'?'<span class="cdeflag">CDE \u26A0</span>':c.cdest==='warn'?'<span class="cdeflag" style="background:#fff7e6;color:#8a6410;border-color:#e8cf94">CDE</span>':'<span class="cdeok">CDE</span>';}
function valSchema(p){
  const cdeMap={};(p.cdes||[]).forEach(c=>cdeMap[c.c]=c.st);
  const tag=(code)=>cdeMap[code]!==undefined?cdeTag({cde:true,cdest:cdeMap[code]}):'';
  const typcell=(x)=>`<span class="mono" style="color:#1b64b0">${esc(x.t)}</span>`;
  const row=(x)=>{
    const vlink = x.vocab?` <span class="chip v" style="cursor:pointer" onclick="go('metrics')">${x.c==='metric_type'?'7 families':METRIC_TOTAL+' metrics'} \u2192</span>`:'';
    return `<tr><td class="mono"><b>${esc(x.c)}</b>${tag(x.c)}</td><td>${typcell(x)}</td><td>${esc(x.role)}</td><td class="note" style="margin:0">${esc(x.d)}${vlink}</td></tr>`;
  };
  return `
  ${portsSection(p)}
  <div class="note" style="margin-top:0;margin-bottom:10px">The physical model is a <b>name\u2013value</b> pair (<span class="mono">metric_type</span> / <span class="mono">metric_value</span>) so new metrics never need a schema change. What the user needs to know \u2014 <i>which</i> metrics Risk produces \u2014 lives in the <a class="chip v" style="cursor:pointer" onclick="go('metrics')">Metric Type vocabulary</a> that <span class="mono">metric_type</span> draws from.</div>
  <div class="lbl">Base grain \u2014 source-aligned (lean)</div>
  <table class="tb"><tr><th>Column</th><th>Type</th><th>Role</th><th>Definition</th></tr>
  ${VAL_BASE.map(row).join('')}
  </table>
  <div class="lbl">Dimensions \u2014 added when MRI assembles the product</div>
  <div class="note" style="margin-top:0;margin-bottom:9px">The product is dimensional / denormalised; these are added at assembly, including the engine that produced each value.</div>
  <table class="tb"><tr><th>Column</th><th>Type</th><th>Role</th><th>Definition</th></tr>
  ${VAL_DIM.map(row).join('')}
  </table>
  <div class="loc" style="margin-top:14px"><b style="color:#fff">Physical location</b> &nbsp; <span class="p">${CATALOG}.valuation_metric</span></div>`;
}


function schemaCols(p){
  const cdeMap={};(p.cdes||[]).forEach(c=>cdeMap[c.c]=c.st);
  const base={
   spfe:[['counterparty_code','string','Counterparty identifier.'],['netting_set_id','string','Netting set / agreement.'],['scenario_id','string','Stress scenario.'],['exposure_value','decimal','PFE exposure amount.'],['country_of_risk','string','Country of risk.'],['run_id','string','Calculation run.']],
   val:[['position_id','string','Position identifier.'],['trade_id','string','Source trade.'],['metric_type','string','NPV / MTM / sensitivity.'],['metric_value','decimal','The computed value.'],['metric_currency','string','ISO-4217 currency.'],['notional','decimal','Position notional.'],['position_date','date','Valuation date.'],['run_id','string','Calculation run.']],
   colpos:[['agreement_id','string','Collateral agreement.'],['ISIN','string','Instrument identifier.'],['collateral_value','decimal','Posted / received value.'],['haircut','decimal','Applied haircut.'],['country_of_risk','string','Issuer country of risk.'],['direction','string','Posted or received.']],
   cpm:[['counterparty_code','string','Primary key.'],['LEI','string','Legal entity identifier.'],['country_of_risk','string','Country of risk.'],['rating','string','Credit rating.'],['parent_code','string','Hierarchy parent.']]
  }[p.id]||[];
  return base.map(r=>({c:r[0],t:r[1],d:r[2],cde:cdeMap[r[0]]!==undefined,cdest:cdeMap[r[0]]}));
}

function prodAccess(p){
  const s=state.subs[p.id]||'none';
  const steps=['Request','Pending approval','Approved','Provisioned'];
  const idx={none:-1,requested:1,approved:2,provisioned:3}[s];
  const wf=steps.map((st,i)=>`<span class="st ${i<idx?'done':i===idx?'cur':''}">${st}</span>`).join('<span class="arw">\u203A</span>');
  let action='';
  if(s==='none') action=`<button class="btn primary" onclick="setSub('${p.id}','requested')">Request access</button>`;
  else if(s==='requested') action=`<button class="btn ok" onclick="setSub('${p.id}','approved')">Approve (demo)</button> <button class="btn" onclick="setSub('${p.id}','none')">Cancel request</button>`;
  else if(s==='approved') action=`<button class="btn primary" onclick="setSub('${p.id}','provisioned')">Provision (demo)</button>`;
  else action=`<span class="badge b-cert">\u2713 Access provisioned</span> <button class="btn" onclick="setSub('${p.id}','none')">Revoke</button>`;
  return `
  <div class="lbl">Access request</div>
  <div class="note" style="margin-top:0;margin-bottom:10px">Access is a tracked, stateful workflow \u2014 not just a button. Requests route to the product owner (${esc(p.owner)}) for approval before provisioning.</div>
  <div class="box2">
    <div class="wf">${wf}</div>
    <div class="btns">${action}</div>
  </div>
  <div class="note">Classification: <b>${esc(p.cls)}</b> \u2014 access is granted per entitlement and reviewed periodically.</div>`;
}

/* ================= SEMANTIC MODEL (ontology) ================= */
function vOntology(){
  const tab=state.tab||'position';
  const T=(id,l)=>`<a class="${tab===id?'on':''}" onclick="go('ontology',null,'${id}')">${l}</a>`;
  let body;
  if(tab==='trade')body=ontoTrade();
  else if(tab==='metrics')body=ontoMetrics(state.id);
  else body=ontoPosition();
  return `<div class="crumb"><a onclick="go('home')">Home</a><span>\u203A</span>Semantic Model</div>
  <div class="hero"><h1>Semantic Model</h1><p>One connected, FIBO-aligned graph behind the risk data. <b>Both diagrams are conceptual ontologies</b> \u2014 not the logical data model (that is the physical schema on each product). The two views are one graph, linked by <span class="mono">Position derivedFrom Trade</span>.</p></div>
  <div class="tabs">${T('position','Position &amp; Metric')}${T('trade','Trade')}${T('metrics','Metric Types ('+METRIC_TOTAL+')')}</div>
  <div class="panel">${body}</div>`;
}


function ontoPosition(){
  return `
  <div class="note" style="margin-top:0;margin-bottom:10px">The conceptual layer over the Position CDM. A <b>Position</b> is held in a Book, derived from a Trade, and <i>decorated by</i> Metrics produced by a Calculation Run (which uses a Scenario, Market Data and a Model). <b>Metric</b> is the root of a taxonomy \u2014 valuation, risk, cashflow and exposure metrics are all subclasses, which is how NPV, PV01, accruals and PFE live in one model.</div>
  <div class="svgbox">${ONTO_POS}</div>
  <div class="grid g2">
    <div class="ent"><div class="en">Position <span class="chip">heldIn Book \u00b7 derivedFrom Trade</span></div><div class="ed">A holding whose value and risk are expressed as metrics. Links back to the Trade ontology.</div></div>
    <div class="ent"><div class="en">Metric <span class="chip v">taxonomy root</span></div><div class="ed">Valuation (NPV, MTM) \u00b7 Risk (Delta, Vega, PV01) \u00b7 Cashflow (accrual, coupon) \u00b7 Exposure (PFE, EE, EPE).</div></div>
    <div class="ent"><div class="en">Calculation Run ${term('calcrun')}</div><div class="ed">One engine execution; <i>uses</i> a Scenario, a Market Data snapshot and a Model. Every metric is traceable to its run.</div></div>
    <div class="ent"><div class="en">Scenario ${term('scenario')}</div><div class="ed">The stress or historical conditions under which metrics are produced.</div></div>
  </div>
  <div class="note">This answers your question directly: an ontology of positions/metrics is <b>not</b> redundant with the logical CDM \u2014 it adds the metric subclass tree, named typed relationships, and the cross-link into the Trade/FIBO graph.</div>`;
}
function ontoTrade(){
  return `
  <div class="note" style="margin-top:0;margin-bottom:10px">The FIBO-aligned conceptual model of a trade: booked by a Legal Entity, in a Book, executed with a Counterparty (identified by LEI). A trade <i>is a</i> an Interest Rate Swap or a Bond; an IRS has exactly two legs; the floating leg references a reference interest-rate index.</div>
  <div class="svgbox">${ONTO_TRADE}</div>

    <div class="frow"><label>Data element (CDE)</label><select id="dqCde" class="fsel" onchange="dqStewardHint('${pid}')">${cdeOpts}</select></div>
    <div class="frow"><label>Quality dimension</label><select id="dqDim" class="fsel">${dims.map(d=>`<option>${d}</option>`).join('')}</select></div>
    <div class="frow"><label>Severity</label><span class="radios"><label><input type="radio" name="dqSev" value="High"> High</label><label><input type="radio" name="dqSev" value="Medium" checked> Medium</label><label><input type="radio" name="dqSev" value="Low"> Low</label></span></div>
    <div class="frow"><label>Description</label><input id="dqDesc" class="finput" style="min-width:340px" placeholder="What is wrong \u2014 e.g. 10 ISINs missing on the feed"></div>
    <div class="frow"><label>Routed to</label><span class="note" style="margin:0" id="dqSteward">${esc(cdeOwner(p,p.cdes[0].c))}</span></div>
    <div class="btns"><button class="btn primary" onclick="submitDqIssue('${pid}')">Submit issue</button><button class="btn" onclick="document.getElementById('dqIssueForm').innerHTML=''">Cancel</button></div>
  </div>`;
}
function submitDqIssue(pid){
  const p=PRODUCTS[pid];
  const cde=document.getElementById('dqCde').value;const dim=document.getElementById('dqDim').value;
  const sevR=document.querySelector('input[name=dqSev]:checked');const sev=sevR?sevR.value:'Medium';
  const desc=document.getElementById('dqDesc').value||'(no description)';
  const id='DQ-'+(100+Math.floor(Math.random()*900));
  document.getElementById('dqIssueForm').innerHTML=`<div class="subform" style="margin-top:12px;border-color:var(--greenln);background:var(--green-t)"><b style="color:var(--green-d)">\u2713 Issue ${id} raised</b> <span class="demo">representative</span><div class="note" style="margin-top:6px">${esc(cde)} \u00b7 ${esc(dim)} \u00b7 <b>${esc(sev)}</b> \u2014 routed to <b>${esc(cdeOwner(p,cde))}</b></div><div class="note">${esc(desc)}</div></div>`;
}


function openRepIssue(idx){
  const r=REPORTS_TCC[idx];
  const aspects=['Accuracy','Completeness','Timeliness / stale','Validity','Report logic / calculation','Presentation'];
  document.getElementById('repIssueForm').innerHTML=`<div class="subform" style="margin-top:12px">
    <div class="lbl" style="margin-top:0">Raise a quality issue \u2014 ${esc(r.name)}</div>
    <div class="note" style="margin-top:0;margin-bottom:12px">Creates a tracked issue against this report, routed to the report owner; it can be linked to the upstream data element when the defect is in source data.</div>
    <div class="frow"><label>Affected aspect</label><select id="riAspect" class="fsel">${aspects.map(a=>`<option>${a}</option>`).join('')}</select></div>
    <div class="frow"><label>Severity</label><span class="radios"><label><input type="radio" name="riSev" value="High"> High</label><label><input type="radio" name="riSev" value="Medium" checked> Medium</label><label><input type="radio" name="riSev" value="Low"> Low</label></span></div>
    <div class="frow"><label>Description</label><input id="riDesc" class="finput" style="min-width:340px" placeholder="What is wrong \u2014 e.g. issuer exposure looks understated vs source"></div>
    <div class="frow"><label>Routed to</label><span class="note" style="margin:0">${esc(r.owner||'Report owner (TCC)')} <span class="chip" style="font-size:9px">report owner</span></span></div>
    <div class="btns"><button class="btn primary" onclick="submitRepIssue(${idx})">Submit issue</button><button class="btn" onclick="document.getElementById('repIssueForm').innerHTML=''">Cancel</button></div>
  </div>`;
}
function submitRepIssue(idx){
  const r=REPORTS_TCC[idx];
  const asp=document.getElementById('riAspect').value;
  const sevR=document.querySelector('input[name=riSev]:checked');const sev=sevR?sevR.value:'Medium';
  const desc=document.getElementById('riDesc').value||'(no description)';
  const id='DQ-'+(100+Math.floor(Math.random()*900));
  document.getElementById('repIssueForm').innerHTML=`<div class="subform" style="margin-top:12px;border-color:var(--greenln);background:var(--green-t)"><b style="color:var(--green-d)">\u2713 Issue ${id} raised</b> <span class="demo">representative</span><div class="note" style="margin-top:6px">${esc(r.name)} \u00b7 ${esc(asp)} \u00b7 <b>${esc(sev)}</b> \u2014 routed to <b>${esc(r.owner||'Report owner (TCC)')}</b></div><div class="note">${esc(desc)}</div></div>`;
}

/* ================= RENDER ================= */
function render(){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===state.view));
  const v=state.view;let html='';
  if(v==='home')html=vHome();
  else if(v==='products')html=vProducts();
  else if(v==='product')html=vProduct();
  else if(v==='quality')html=vQuality();
  else if(v==='ontology')html=vOntology();
  else if(v==='sources')html=vSources();
  else if(v==='glossary')html=vGlossary();
  else if(v==='term')html=vTerm();
  else if(v==='access')html=vAccess();
  else if(v==='source')html=vSource();
  else if(v==='subs')html=vSubs();
  else if(v==='app')html=vApp();
  else if(v==='report')html=vReport();
  else if(v==='metrics'){state.view='ontology';state.tab='metrics';html=vOntology();}
  else if(v==='domains')html=vDomains();
  else if(v==='domain')html=vDomain();
  else if(v==='dataset')html=vDataset();
  else if(v==='ddoms')html=vDDoms();
  else if(v==='ddom')html=vDDom();
  else html=vHome();
  const bb=(_hist.length&&state.view!=='home')?`<div class="backbar"><a onclick="back()">\u2039 Back</a></div>`:'';
  document.getElementById('app').innerHTML=bb+html;
}
render();
</script>
</body>
</html>
